# Example: Radxa ZERO 3E server image with a mainline 7.2.8 kernel.
# Copy to config-zero3e.conf, adjust, then: sudo ./build.sh build CONFIG=zero3e
BOARD=radxa-zero3e
RELEASE=trixie

KERNEL_SOURCE=mainline
KERNEL_VERSION=7.2.8
# Exact parity with a running unit:  ssh unit zcat /proc/config.gz > userpatches/kernel/zero3e-7.2.8.config
# (Armbian kernels have IKCONFIG; otherwise copy /boot/config-*)
KERNEL_CONFIG=file
KERNEL_CONFIG_FILE=userpatches/kernel/zero3e-7.2.8.config
KERNEL_ARMBIAN_PATCHES=yes        # after: sudo ./build.sh armbian-import CONFIG=zero3e
KERNEL_OVERLAYS=yes
KERNEL_LOCALVERSION=-fleet

UBOOT_VERSION=latest
BL31_SOURCE=rkbin

VARIANT=server
NETWORK=networkd
IMAGE_HOSTNAME='zero3e-{MAC}'
TIMEZONE=Etc/UTC
USER_NAME=admin
USER_SSH_KEYS=~/.ssh/id_ed25519.pub
SSH_PASSWORD_AUTH=no

ZRAM=yes
RAMLOG=volatile
FDT_OVERLAYS=""

# FLEET_REPO_URL=https://apt.example.lan/fleet
# FLEET_REPO_KEY=userpatches/fleet-repo.asc
# UNATTENDED_UPGRADES=yes
