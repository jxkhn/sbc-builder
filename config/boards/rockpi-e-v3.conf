# Radxa ROCK Pi E v3.0 (RK3328) - added for testing; boot chain follows Armbian's settings for this board/SoC.
BOARD_NAME="Radxa ROCK Pi E v3.0 (RK3328)"
SOC=rk3328

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3328-rock-pi-e.dtb"
KERNEL_CMDLINE="console=tty1 console=ttyS2,1500000"
PATCH_DTS_REGEX='rock-pi-e|/rk3328\.dtsi$'
PATCH_SOC_REGEX='rk3328|rock-?pi-?e|rockpie'

UBOOT_DEFCONFIG="rock-pi-e-v3-rk3328_defconfig"
BOARD_UBOOT_VERSION=v2026.04
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
RKBIN_TPL="rk33/rk3328_ddr_333MHz_v1.22.bin"
RKBIN_BL31="rk33/rk322xh_bl31_v1.49.elf"
TFA_PLAT=rk3328
BOARD_TFA_VERSION=v2.13.0        # v2.14+ overflows the RK3328 PMU SRAM (by 8 bytes, GCC 13)
TPL_OPEN=yes
BOARD_PACKAGES=""
BOARD_NOTES="Only the bootloader differs from v1.x/v2.x (DDR4); same kernel device tree."
