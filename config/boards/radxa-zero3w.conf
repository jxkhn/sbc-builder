# Radxa ZERO 3W - RK3566, eMMC option, Wi-Fi/BT
BOARD_NAME="Radxa ZERO 3W (RK3566)"
SOC=rk3566

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3566-radxa-zero-3w.dtb"
KERNEL_CMDLINE="console=tty1 console=ttyS2,1500000"
PATCH_DTS_REGEX='radxa-zero-3|/rk356(6|8|x)(-base|-pinctrl)?\.dtsi$'   # device trees that are yours (board + SoC dtsi)
PATCH_SOC_REGEX='rk356[68x]|rk35xx|zero-?3'   # driver patches relevant to your SoC

UBOOT_DEFCONFIG="radxa-zero-3-rk3566_defconfig"
# Same boot chain as Armbian's Zero 3 images (unchanged there since early 2026, widely used
# in the field): U-Boot v2025.10 + DDR v1.21 + BL31 v1.44. Upstream rkbin no longer carries
# these versions, so they come from Armbian's rkbin mirror (build time only).
# With v2026.10 the kernel did not find the Ethernet PHY on a test board.
BOARD_UBOOT_VERSION=v2025.10
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
RKBIN_TPL="rk35/rk3566_ddr_1056MHz_v1.21.bin"
RKBIN_BL31="rk35/rk3568_bl31_v1.44.elf"
TFA_PLAT=rk3568

# NOTE: newer 3W revisions use an AIC8800 Wi-Fi chip whose driver is not in mainline
# Linux (Armbian adds it as an out-of-tree DKMS extension). Older revisions with an
# AP6212 work with brcmfmac + firmware-brcm80211.
BOARD_PACKAGES="firmware-brcm80211 wpasupplicant"
BOARD_NOTES="Wi-Fi on AIC8800 revisions needs an out-of-tree driver"
