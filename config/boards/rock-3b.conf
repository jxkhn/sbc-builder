# Radxa ROCK 3B (RK3568) - added for testing; boot chain follows Armbian's settings for this board/SoC.
BOARD_NAME="Radxa ROCK 3B (RK3568)"
SOC=rk3568

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3568-rock-3b.dtb"
KERNEL_CMDLINE="console=tty1 console=ttyS2,1500000"
PATCH_DTS_REGEX='rock-3b|/rk356(6|8|x)(-base|-pinctrl)?\.dtsi$'
PATCH_SOC_REGEX='rk356[68x]|rk35xx|rock-?3b'

UBOOT_DEFCONFIG="rock-3b-rk3568_defconfig"
BOARD_UBOOT_VERSION=v2026.04
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
RKBIN_TPL="rk35/rk3568_ddr_1560MHz_v1.21.bin"
RKBIN_BL31="rk35/rk3568_bl31_v1.44.elf"
TFA_PLAT=rk3568

BOARD_PACKAGES=""
BOARD_NOTES=""
