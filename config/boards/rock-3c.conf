# Radxa ROCK 3C (RK3566T) - added for testing; boot chain follows Armbian's settings for this board/SoC.
BOARD_NAME="Radxa ROCK 3C (RK3566T)"
SOC=rk3566

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3566-rock-3c.dtb"
KERNEL_CMDLINE="console=tty1 console=ttyS2,1500000"
PATCH_DTS_REGEX='rock-3c|/rk356(6|8|x)(-base|-pinctrl)?\.dtsi$|/rk3566t\.dtsi$'
PATCH_SOC_REGEX='rk356[68x]|rk35xx|rock-?3c'

UBOOT_DEFCONFIG="rock-3c-rk3566_defconfig"
BOARD_UBOOT_VERSION=v2026.04
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
RKBIN_TPL="rk35/rk3566_ddr_1056MHz_v1.21.bin"
RKBIN_BL31="rk35/rk3568_bl31_v1.44.elf"
TFA_PLAT=rk3568

BOARD_PACKAGES=""
BOARD_NOTES="RK3566T: mainline caps the CPU at 1.4 GHz, like the ZERO 3."
