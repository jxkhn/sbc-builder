# Radxa ROCK 5B (RK3588) - added for testing; boot chain follows Armbian's settings for this board/SoC.
BOARD_NAME="Radxa ROCK 5B (RK3588)"
SOC=rk3588

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3588-rock-5b.dtb"
KERNEL_CMDLINE="console=tty1 console=ttyS2,1500000"
PATCH_DTS_REGEX='rock-5b|/rk3588(s)?(-base|-extra|-pinctrl)?\.dtsi$'
PATCH_SOC_REGEX='rk3588|rk35xx|rock-?5b'

UBOOT_DEFCONFIG="rock5b-rk3588_defconfig"
BOARD_UBOOT_VERSION=v2026.01
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
RKBIN_TPL="rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.20_20250926.bin"
RKBIN_BL31="rk35/rk3588_bl31_v1.48.elf"
TFA_PLAT=rk3588

BOARD_PACKAGES=""
BOARD_NOTES="SPI NOR boots before the SD card: erase it or flash this U-Boot there (u-boot-rockchip-spi.bin)."
