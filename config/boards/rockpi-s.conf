# Radxa ROCK Pi S - RK3308, 256/512 MiB RAM, 100M Ethernet, RTL8723DS Wi-Fi/BT
BOARD_NAME="Radxa ROCK Pi S (RK3308)"
SOC=rk3308

KERNEL_FAMILY=rockchip64
ARMBIAN_FAMILY=rockchip64
DTB="rockchip/rk3308-rock-pi-s.dtb"
KERNEL_CMDLINE="console=ttyS0,1500000"
PATCH_DTS_REGEX='rock-pi-s|/rk3308\.dtsi$'   # device trees that are yours (board + SoC dtsi)
PATCH_SOC_REGEX='rk3308|rock-?pi-?s|rockpis'   # driver patches relevant to your SoC

UBOOT_DEFCONFIG="rock-pi-s-rk3308_defconfig"
UBOOT_BIN="u-boot-rockchip.bin"
UBOOT_OFFSET_SECTORS=64
# The ROCK Pi S debug console is UART0. Upstream rkbin only ships uart2/uart4 variants
# of the RK3308 DDR blob; Armbian's rkbin mirror still carries the uart0 one, so it is
# the default blob source here (build-time only - nothing from it ends up in the rootfs
# except the bootloader binary). Override with RKBIN_REPO=... if you prefer.
BOARD_RKBIN_REPO="https://github.com/armbian/rkbin.git"
RKBIN_TPL="rk33/rk3308_ddr_589MHz_uart0_m0_v*.bin bin/rk33/rk3308_ddr_589MHz_uart0_m0_v*.bin"
RKBIN_BL31="rk33/rk3308_bl31_v*.elf bin/rk33/rk3308_bl31_v*.elf"
TFA_PLAT=""                       # no RK3308 platform in upstream TF-A

BOARD_PACKAGES="firmware-realtek wpasupplicant"   # rtw88 SDIO Wi-Fi
